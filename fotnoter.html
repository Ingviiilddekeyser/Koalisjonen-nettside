<title>Fotnoter</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "Times New Roman", Times, serif;
    background-color: #f5f5f5;
    color: #000000;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header / breadcrumb */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 30px 40px;
  }

  .breadcrumb {
    font-size: 16px;
    font-family: "Times New Roman", Times, serif;
  }

  .breadcrumb a {
    color: inherit;
    text-decoration: none;
  }

  .breadcrumb a:hover {
    text-decoration: underline;
  }

  .breadcrumb-separator {
    margin: 0 4px;
  }

  /* Logo slot, top right */
  .logo-slot {
    width: 100px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-slot img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  /* Main body text */
  main {
    flex: 1;
    padding: 0 40px;
  }

  .body-text {
    font-family: "Times New Roman", Times, serif;
    font-size: 30px;
    line-height: 1.4;
    margin-top: 40px;
    max-width: 800px;
    padding: 40px;
  }

      <a href="/">Koalisjonen</a><span class="breadcrumb-separator">/</span><a href="/fotnoter.html">fotnoter</a>

    <div class="logo-slot">

<div class="body-text"></div>
<script>

  -mingle med hyggelige mennesker, og kjøpe Fotnoter på

-8.august

  container.appendChild(telescopicContent);
